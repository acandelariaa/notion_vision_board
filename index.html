<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board</title>
    <style>
        /* Importamos una fuente limpia que se ve bien en Notion */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Ideal para el modo claro/oscuro de Notion */
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- CINTA DE IMÁGENES --- */
        .slider-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            padding: 20px 0;
        }

        .slider-track {
            display: inline-block;
            /* Cambia los '30s' para hacer que vaya más rápido o más lento */
            animation: scroll 45s linear infinite; 
        }

        .slider-track img {
            height: 250px;
            width: auto;
            margin: 0 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            object-fit: cover;
            vertical-align: middle;
        }

        /* Animación para el bucle infinito */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
            /* Se desplaza hasta el 50% porque duplicaremos las imágenes en el HTML */
        }

        /* --- SECCIÓN DE FRASES --- */
        .quote-container {
            margin-top: 40px;
            text-align: center;
            max-width: 80%;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quote {
            font-size: 1.3rem;
            font-weight: 300;
            color: #444; /* Usa un gris claro (#eee) si tu Notion está en modo oscuro */
            font-style: italic;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        .quote.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- SECCIÓN DE FRASES -->
    <div class="quote-container">
        <div class="quote" id="quote-text">"El futuro pertenece a quienes creen en la belleza de sus sueños."</div>
    </div>

    <script>
        // Arreglo con tus frases
        const quotes = [
            '"Sé mejor que hace un segundo"',
            '"El miedo es el precio que pagas por todo aquello que vale la pena vivir"',
            '"El futuro pertenece a quienes creen en la belleza de sus sueños."',
            '"La disciplina es el puente entre las metas y los logros."',
            '"No te detengas hasta que te sientas orgulloso."',
            '"Confía en el proceso, mantente enfocado."',
            '"Tu única competencia es la persona que eras ayer."'
        ];

        let currentQuote = 0;
        const quoteElement = document.getElementById('quote-text');

        // Función para rotar las frases
        setInterval(() => {
            // 1. Inicia el desvanecimiento (fade out)
            quoteElement.classList.add('fade-out');
            
            // 2. Espera a que termine la transición (1 segundo) para cambiar el texto
            setTimeout(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                quoteElement.innerText = quotes[currentQuote];
                
                // 3. Regresa la opacidad (fade in)
                quoteElement.classList.remove('fade-out');
            }, 1000); 
            
        }, 7000); // Cambia de frase cada 7 segundos
    </script>
