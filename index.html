<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board - Cascada Collage</title>
    <style>
        /* La fuente Inter solo la dejamos de respaldo, usaremos Times New Roman para todo el texto */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            height: 100vh;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* --- CINTA DEL COLLAGE --- */
        .slider-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            padding: 10px;
            box-sizing: border-box;
        }

        .slider-track {
            width: 100%;
            /* La animación va en negativo a 0 para que el efecto sea de "caída" (bajando) */
            animation: scroll-down 60s linear infinite;
        }

        .masonry-grid {
            /* 2 columnas para espacios estrechos en Notion, se ve muy bien como tira vertical */
            column-count: 2; 
            column-gap: 15px;
            width: 100%;
            padding-bottom: 15px;
        }

        /* Si haces el bloque de Notion más ancho, automáticamente pasará a 3 columnas */
        @media (min-width: 600px) {
            .masonry-grid { column-count: 3; } 
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 15px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: block;
        }

        /* Animación para que las imágenes bajen */
        @keyframes scroll-down {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        /* --- BANNER DE FRASES (ABAJO Y SUTIL) --- */
        .bottom-banner {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            /* Degradado suave que va de transparente a sólido hacia abajo, sin líneas duras */
            background: linear-gradient(to top, rgba(255, 255, 255, 1) 15%, rgba(255, 255, 255, 0.75) 50%, rgba(255, 255, 255, 0) 100%);
            padding: 80px 20px 30px; /* Más padding arriba para que el degradado sea larguísimo y difuminado */
            box-sizing: border-box;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* Soporte para el modo oscuro de Notion manteniendo el degradado sutil */
        @media (prefers-color-scheme: dark) {
            .bottom-banner {
                background: linear-gradient(to top, rgba(25, 25, 25, 1) 15%, rgba(25, 25, 25, 0.75) 50%, rgba(25, 25, 25, 0) 100%);
            }
            .quote-text { color: #f5f5f5 !important; }
            .quote-author { color: #bbb !important; }
        }

        .quote-content {
            transition: opacity 1.2s ease-in-out;
            opacity: 1;
            max-width: 95%;
        }

        .quote-content.fade-out {
            opacity: 0;
        }

        .quote-text {
            /* Tipografía clásica, sin itálicas */
            font-family: 'Times New Roman', Times, serif;
            font-style: normal; 
            font-size: 1.35rem;
            color: #111;
            margin: 0;
            line-height: 1.4;
        }

        .quote-author {
            font-family: 'Times New Roman', Times, serif;
            font-style: normal;
            font-size: 1rem;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- CINTA DE COLLAGE QUE BAJA -->
    <div class="slider-container">
        <div class="slider-track" id="track">
            
            <!-- GRUPO 1 DEL COLLAGE -->
            <div class="masonry-grid">
                <img class="masonry-item" src="https://i.pinimg.com/736x/dd/8b/f6/dd8bf641987d26b53e60e86d4e49b8b5.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/1200x/30/82/83/3082832b2c8edec35084f4e468110ae2.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/6d/77/c8/6d77c8d1e7100690cf1d67922d4cd379.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/1200x/d0/6b/3d/d06b3daed24214260a1ad36084daf9cd.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/bd/44/de/bd44de16056b2765f3c00cd429ce8081.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/b3/f6/91/b3f691e724fcedb56a816193eb9fd7f4.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/c0/50/07/c050072e44d84eb96de4a6c6e8f9ba6c.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/1200x/66/d6/94/66d694bf89009897cfea59cab3807e3d.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/02/e0/86/02e08602c0873eac50926de147176f72.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/ec/85/34/ec85348715cdec6be19fa49542319c7e.jpg" alt="Vision">
            </div>

            <!-- GRUPO 2 DEL COLLAGE (DUPLICADO PARA QUE NUNCA SE ACABE EL BUCLE) -->
            <div class="masonry-grid">
                <img class="masonry-item" src="https://i.pinimg.com/736x/dd/8b/f6/dd8bf641987d26b53e60e86d4e49b8b5.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/1200x/30/82/83/3082832b2c8edec35084f4e468110ae2.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/6d/77/c8/6d77c8d1e7100690cf1d67922d4cd379.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/1200x/d0/6b/3d/d06b3daed24214260a1ad36084daf9cd.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/bd/44/de/bd44de16056b2765f3c00cd429ce8081.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/b3/f6/91/b3f691e724fcedb56a816193eb9fd7f4.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/c0/50/07/c050072e44d84eb96de4a6c6e8f9ba6c.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/1200x/66/d6/94/66d694bf89009897cfea59cab3807e3d.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/02/e0/86/02e08602c0873eac50926de147176f72.jpg" alt="Vision">
                <img class="masonry-item" src="https://i.pinimg.com/736x/ec/85/34/ec85348715cdec6be19fa49542319c7e.jpg" alt="Vision">
            </div>
            
        </div>
    </div>

    <!-- BANNER SUTIL CON LAS FRASES (ABAJO) -->
    <div class="bottom-banner">
        <div class="quote-content" id="quote-box">
            <p class="quote-text" id="quote-text">"El futuro pertenece a quienes creen en la belleza de sus sueños."</p>
            <p class="quote-author" id="quote-author">— Eleanor Roosevelt</p>
        </div>
    </div>

    <script>
        const quotes = [
            { text: '"El futuro pertenece a quienes creen en la belleza de sus sueños."', author: 'Eleanor Roosevelt' },
            { text: '"Sé mejor que hace un segundo."', author: 'Anónimo' },
            { text: '"El miedo es el precio que pagas por todo aquello que vale la pena vivir."', author: 'Anónimo' },
            { text: '"La disciplina es el puente entre las metas y los logros."', author: 'Jim Rohn' },
            { text: '"No te detengas hasta que te sientas orgulloso."', author: 'Anónimo' },
            { text: '"Tu única competencia es la persona que eras ayer."', author: 'Anónimo' },
            { text: '"Confía en el proceso, mantente enfocado."', author: 'Anónimo' }
        ];

        let currentQuote = 0;
        const quoteBox = document.getElementById('quote-box');
        const quoteText = document.getElementById('quote-text');
        const quoteAuthor = document.getElementById('quote-author');

        // Rotación suave del texto cada 8 segundos
        setInterval(() => {
            quoteBox.classList.add('fade-out');
            
            setTimeout(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                quoteText.innerText = quotes[currentQuote].text;
                quoteAuthor.innerText = '— ' + quotes[currentQuote].author;
                
                quoteBox.classList.remove('fade-out');
            }, 1200); 
            
        }, 8000); 
    </script>
</body>
</html>
