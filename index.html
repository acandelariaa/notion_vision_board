<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board - Collage Animado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            padding: 20px;
        }

        /* --- COLLAGE DE IMÁGENES --- */
        .collage-container {
            display: grid;
            /* Cuadrícula de 4 columnas */
            grid-template-columns: repeat(4, 1fr);
            /* Altura base de cada fila */
            grid-auto-rows: 130px; 
            gap: 12px;
            width: 100%;
            max-width: 800px;
        }

        /* Dando diferentes tamaños a las piezas del collage para un look asimétrico */
        .slot-1 { grid-column: span 2; grid-row: span 2; } /* Cuadrado grande */
        .slot-2 { grid-column: span 1; grid-row: span 1; } /* Cuadrado pequeño */
        .slot-3 { grid-column: span 1; grid-row: span 2; } /* Rectángulo vertical */
        .slot-4 { grid-column: span 1; grid-row: span 1; } /* Cuadrado pequeño */
        .slot-5 { grid-column: span 2; grid-row: span 1; } /* Rectángulo horizontal */
        .slot-6 { grid-column: span 2; grid-row: span 1; } /* Rectángulo horizontal */

        .collage-item {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: opacity 1.5s ease-in-out; /* Transición lenta y elegante */
            opacity: 1;
        }

        .collage-item.fade-out {
            opacity: 0;
        }

        /* Ajuste para pantallas pequeñas */
        @media (max-width: 600px) {
            .collage-container {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 100px;
            }
            .slot-1 { grid-column: span 2; grid-row: span 2; }
            .slot-2, .slot-3, .slot-4, .slot-5, .slot-6 { grid-column: span 1; grid-row: span 1; }
        }

        /* --- SECCIÓN DE FRASES --- */
        .quote-container {
            margin-top: 30px;
            text-align: center;
            max-width: 90%;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quote {
            font-size: 1.2rem;
            font-weight: 300;
            color: #444; 
            font-style: italic;
            opacity: 1;
            transition: opacity 1s ease-in-out;
            letter-spacing: 0.5px;
        }

        .quote.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- COLLAGE -->
    <div class="collage-container">
        <!-- 6 espacios visuales donde las imágenes irán rotando -->
        <img class="collage-item slot-1" id="img-slot-1" src="" alt="Vision">
        <img class="collage-item slot-2" id="img-slot-2" src="" alt="Vision">
        <img class="collage-item slot-3" id="img-slot-3" src="" alt="Vision">
        <img class="collage-item slot-4" id="img-slot-4" src="" alt="Vision">
        <img class="collage-item slot-5" id="img-slot-5" src="" alt="Vision">
        <img class="collage-item slot-6" id="img-slot-6" src="" alt="Vision">
    </div>

    <!-- SECCIÓN DE FRASES -->
    <div class="quote-container">
        <div class="quote" id="quote-text">"Sé mejor que hace un segundo"</div>
    </div>

    <script>
        // --- LÓGICA DE LAS IMÁGENES ---
        // Todas tus imágenes de Pinterest
        const allImages = [
            "https://i.pinimg.com/736x/dd/8b/f6/dd8bf641987d26b53e60e86d4e49b8b5.jpg",
            "https://i.pinimg.com/1200x/30/82/83/3082832b2c8edec35084f4e468110ae2.jpg",
            "https://i.pinimg.com/736x/6d/77/c8/6d77c8d1e7100690cf1d67922d4cd379.jpg",
            "https://i.pinimg.com/1200x/d0/6b/3d/d06b3daed24214260a1ad36084daf9cd.jpg",
            "https://i.pinimg.com/736x/bd/44/de/bd44de16056b2765f3c00cd429ce8081.jpg",
            "https://i.pinimg.com/736x/b3/f6/91/b3f691e724fcedb56a816193eb9fd7f4.jpg",
            "https://i.pinimg.com/736x/c0/50/07/c050072e44d84eb96de4a6c6e8f9ba6c.jpg",
            "https://i.pinimg.com/1200x/66/d6/94/66d694bf89009897cfea59cab3807e3d.jpg",
            "https://i.pinimg.com/736x/02/e0/86/02e08602c0873eac50926de147176f72.jpg",
            "https://i.pinimg.com/736x/ec/85/34/ec85348715cdec6be19fa49542319c7e.jpg",
            "https://i.pinimg.com/1200x/4c/c5/19/4cc51953538fa53c737acf61466969ed.jpg",
            "https://i.pinimg.com/736x/c6/aa/b0/c6aab0710727d17b4298a6dab25ac555.jpg",
            "https://i.pinimg.com/1200x/34/42/05/344205701a26191b6eee948a71178065.jpg",
            "https://i.pinimg.com/1200x/72/f1/8e/72f18edc3fe7d527aa3947a040adf195.jpg",
            "https://i.pinimg.com/736x/3e/94/36/3e9436a01e789b1ffa052329044c1c8c.jpg",
            "https://i.pinimg.com/1200x/dd/98/c9/dd98c924021bd0aa88e3f51524c43c03.jpg",
            "https://i.pinimg.com/1200x/2d/4e/f7/2d4ef74abb20557da52ffeb7f16b1bbe.jpg",
            "https://i.pinimg.com/736x/06/37/35/0637356f1bf2a290141c8260c44ff3d9.jpg",
            "https://i.pinimg.com/1200x/14/6f/b0/146fb0d567b0a2f68bafbedd38d582fd.jpg",
            "https://i.pinimg.com/736x/25/c7/b0/25c7b04d070b8cebf7fe798e8c286e5b.jpg",
            "https://i.pinimg.com/736x/51/95/3b/51953b07aca3f0808c1996f4eae3df98.jpg"
        ];

        const totalSlots = 6;
        let displayedImages = [];

        // Función para obtener una imagen aleatoria que no esté ya en pantalla
        function getNewRandomImage() {
            let newImg;
            do {
                newImg = allImages[Math.floor(Math.random() * allImages.length)];
            } while (displayedImages.includes(newImg));
            return newImg;
        }

        // Cargar las primeras 6 imágenes al inicio
        for (let i = 1; i <= totalSlots; i++) {
            const slot = document.getElementById(`img-slot-${i}`);
            const randomImg = getNewRandomImage();
            slot.src = randomImg;
            displayedImages.push(randomImg);
        }

        // Bucle para cambiar una imagen aleatoria cada 3.5 segundos
        setInterval(() => {
            // Elegir un slot al azar (del 1 al 6)
            const randomSlotIndex = Math.floor(Math.random() * totalSlots) + 1;
            const slotToChange = document.getElementById(`img-slot-${randomSlotIndex}`);
            
            // Iniciar efecto de desvanecimiento
            slotToChange.classList.add('fade-out');

            // Esperar a que la imagen desaparezca (1.5s) antes de cambiar la fuente
            setTimeout(() => {
                const newImg = getNewRandomImage();
                
                // Actualizar el registro de imágenes mostradas
                displayedImages[randomSlotIndex - 1] = newImg;
                
                // Cambiar la imagen y quitar el desvanecimiento
                slotToChange.src = newImg;
                slotToChange.classList.remove('fade-out');
            }, 1500); 

        }, 3500); // Frecuencia de cambio de imágenes


        // --- LÓGICA DE LAS FRASES ---
        const quotes = [
            '"Sé mejor que hace un segundo"',
            '"El miedo es el precio que pagas por todo aquello que vale la pena vivir"',
            '"El futuro pertenece a quienes creen en la belleza de sus sueños."',
            '"La disciplina es el puente entre las metas y los logros."',
            '"No te detengas hasta que te sientas orgulloso."',
            '"Confía en el proceso, mantente enfocado."',
            '"Tu única competencia es la persona que eras ayer."'
        ];

        let currentQuote = 0;
        const quoteElement = document.getElementById('quote-text');

        setInterval(() => {
            quoteElement.classList.add('fade-out');
            
            setTimeout(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                quoteElement.innerText = quotes[currentQuote];
                quoteElement.classList.remove('fade-out');
            }, 1000); 
            
        }, 7000); 
    </script>
</body>
</html>
