<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board - Cinta Vertical</title>
    <style>
        /* Importamos una fuente limpia para el autor y el resto del documento */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Evita que aparezca la barra de scroll nativa */
            box-sizing: border-box;
        }

        /* --- BANNER FIJO (ARRIBA) --- */
        .quote-banner {
            position: relative;
            z-index: 10;
            width: 100%;
            /* Fondo semi-transparente para dar un efecto cristal */
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(8px);
            padding: 25px 20px;
            box-sizing: border-box;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }

        /* Soporte para Modo Oscuro en Notion */
        @media (prefers-color-scheme: dark) {
            .quote-banner {
                background: rgba(25, 25, 25, 0.90);
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }
            .quote-text { color: #f5f5f5 !important; }
            .quote-author { color: #aaa !important; }
        }

        .quote-content {
            transition: opacity 1.2s ease-in-out;
            opacity: 1;
        }

        .quote-content.fade-out {
            opacity: 0;
        }

        .quote-text {
            /* Tipografía clásica solicitada */
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.5rem;
            font-style: italic;
            color: #222;
            margin: 0;
            line-height: 1.3;
        }

        .quote-author {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #666;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* --- CINTA DE IMÁGENES VERTICAL --- */
        .slider-container {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .slider-track {
            display: flex;
            flex-direction: column;
            width: 100%;
            /* Animación hacia arriba, durará 60 segundos por ciclo */
            animation: scroll-vertical 60s linear infinite;
        }

        .slider-track img {
            width: 100%;
            height: auto; /* Mantiene la proporción original, nada se corta */
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: block;
        }

        @keyframes scroll-vertical {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); } 
            /* Se desplaza el 50% porque duplicamos el contenido abajo */
        }
    </style>
</head>
<body>

    <!-- BANNER FIJO CON LAS FRASES -->
    <div class="quote-banner">
        <div class="quote-content" id="quote-box">
            <p class="quote-text" id="quote-text">"El futuro pertenece a quienes creen en la belleza de sus sueños."</p>
            <p class="quote-author" id="quote-author">— Eleanor Roosevelt</p>
        </div>
    </div>

    <!-- CINTA QUE SE DESPLAZA -->
    <div class="slider-container">
        <div class="slider-track" id="track">
            
            <!-- GRUPO 1 DE IMÁGENES -->
            <img src="https://i.pinimg.com/736x/dd/8b/f6/dd8bf641987d26b53e60e86d4e49b8b5.jpg" alt="Vision">
            <img src="https://i.pinimg.com/1200x/30/82/83/3082832b2c8edec35084f4e468110ae2.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/6d/77/c8/6d77c8d1e7100690cf1d67922d4cd379.jpg" alt="Vision">
            <img src="https://i.pinimg.com/1200x/d0/6b/3d/d06b3daed24214260a1ad36084daf9cd.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/bd/44/de/bd44de16056b2765f3c00cd429ce8081.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/b3/f6/91/b3f691e724fcedb56a816193eb9fd7f4.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/c0/50/07/c050072e44d84eb96de4a6c6e8f9ba6c.jpg" alt="Vision">

            <!-- GRUPO 2 (COPIA EXACTA DEL GRUPO 1 PARA QUE EL BUCLE SEA INFINITO) -->
            <img src="https://i.pinimg.com/736x/dd/8b/f6/dd8bf641987d26b53e60e86d4e49b8b5.jpg" alt="Vision">
            <img src="https://i.pinimg.com/1200x/30/82/83/3082832b2c8edec35084f4e468110ae2.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/6d/77/c8/6d77c8d1e7100690cf1d67922d4cd379.jpg" alt="Vision">
            <img src="https://i.pinimg.com/1200x/d0/6b/3d/d06b3daed24214260a1ad36084daf9cd.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/bd/44/de/bd44de16056b2765f3c00cd429ce8081.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/b3/f6/91/b3f691e724fcedb56a816193eb9fd7f4.jpg" alt="Vision">
            <img src="https://i.pinimg.com/736x/c0/50/07/c050072e44d84eb96de4a6c6e8f9ba6c.jpg" alt="Vision">
            
        </div>
    </div>

    <script>
        // Lógica de Frases con Autores
        const quotes = [
            { text: '"El futuro pertenece a quienes creen en la belleza de sus sueños."', author: 'Eleanor Roosevelt' },
            { text: '"Sé mejor que hace un segundo."', author: 'Anónimo' },
            { text: '"El miedo es el precio que pagas por todo aquello que vale la pena vivir."', author: 'Anónimo' },
            { text: '"La disciplina es el puente entre las metas y los logros."', author: 'Jim Rohn' },
            { text: '"No te detengas hasta que te sientas orgulloso."', author: 'Anónimo' },
            { text: '"Tu única competencia es la persona que eras ayer."', author: 'Anónimo' },
            { text: '"Confía en el proceso, mantente enfocado."', author: 'Anónimo' }
        ];

        let currentQuote = 0;
        const quoteBox = document.getElementById('quote-box');
        const quoteText = document.getElementById('quote-text');
        const quoteAuthor = document.getElementById('quote-author');

        // Cambia la frase cada 8 segundos
        setInterval(() => {
            quoteBox.classList.add('fade-out');
            
            setTimeout(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                quoteText.innerText = quotes[currentQuote].text;
                quoteAuthor.innerText = '— ' + quotes[currentQuote].author;
                
                quoteBox.classList.remove('fade-out');
            }, 1200); 
            
        }, 8000); 
    </script>
</body>
</html>
